[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminalmd"
version = "0.1.0"
description = "Search and browse your Claude Code conversation history"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["claude", "claude-code", "ai", "terminal", "search", "history"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
# main.py is installed as the 'main' module via py-modules below
tm = "main:main"

[project.urls]
Homepage = "https://github.com/CoderShibay/terminalmd"
Issues   = "https://github.com/CoderShibay/terminalmd/issues"

[tool.setuptools]
# Root-level .py files installed as top-level modules
py-modules = ["main", "server", "service", "paths"]

[tool.setuptools.packages.find]
# cli/, indexer/, db/ all have __init__.py so setuptools finds them automatically
where = ["."]
exclude = ["tests*", "*.egg-info"]

[tool.setuptools.package-data]
# dashboard.html lives in db/ so it travels with the package on pip install
db = ["schema.sql", "dashboard.html"]
