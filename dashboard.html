<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerminalMind</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0d0d12; color:#e2e8f0; font-family:'Inter',system-ui,sans-serif; }
  .card { background:#14141f; border:1px solid #23233a; border-radius:12px; }
  .session-card { background:#14141f; border:1px solid #23233a; border-radius:10px; transition:border-color 0.15s,background 0.15s; cursor:pointer; }
  .session-card:hover { border-color:#4f46e5; background:#17172a; }
  .session-card.expanded { border-color:#4f46e5; }
  .tag { display:inline-flex; align-items:center; background:#1e1e35; border:1px solid #2d2d4d; border-radius:99px; font-size:11px; padding:2px 9px; color:#94a3b8; }
  .tag.active { background:#3730a3; border-color:#4f46e5; color:#c7d2fe; }
  mark { background:#fbbf2430; color:#fcd34d; border-radius:2px; padding:0 2px; }
  input:focus,textarea:focus { outline:none; border-color:#4f46e5; }
  ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2d2d4d; border-radius:4px; }
  .msg-user { border-left:2px solid #4f46e5; }
  .msg-asst { border-left:2px solid #22c55e; }
  .msg-tool { border-left:2px solid #f59e0b; }
  .fade-in { animation:fadeIn 0.18s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }
  .dot-active { background:#22c55e; }
  .dot-idle   { background:#475569; }
  .dot-busy   { background:#f59e0b; }
  .date-group { position:sticky; top:0; z-index:5; backdrop-filter:blur(12px); }
  .spinner { animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .tab-btn { padding:6px 16px; border-radius:7px; font-size:13px; color:#64748b; cursor:pointer; transition:all 0.12s; }
  .tab-btn.on { background:#14141f; color:#e2e8f0; border:1px solid #23233a; }
  .tab-btn:hover:not(.on) { color:#cbd5e1; }
</style>
</head>
<body class="min-h-screen">

<!-- Header -->
<div class="sticky top-0 z-20 border-b border-[#1e1e30] px-6 py-3 flex items-center gap-4" style="background:#0d0d12cc;backdrop-filter:blur(16px)">
  <button onclick="goHome()" class="flex items-center gap-2.5 mr-2 hover:opacity-80 transition-opacity">
    <div class="w-6 h-6 rounded-md flex items-center justify-center text-xs font-bold" style="background:#4f46e5">⚡</div>
    <span class="font-semibold text-[15px] text-white">TerminalMind</span>
  </button>
  <div class="flex gap-0.5">
    <button onclick="setTab('browse')" id="tab-browse" class="tab-btn on">Browse</button>
    <button onclick="setTab('search')" id="tab-search" class="tab-btn">Search</button>
  </div>
  <div class="flex items-center gap-4 ml-auto">
    <div id="tag-bar" class="flex gap-1.5 flex-wrap items-center">
      <button id="clear-filter-btn" onclick="clearFilter()" class="hidden text-[11px] text-[#475569] hover:text-[#94a3b8] border border-[#23233a] rounded-md px-2 py-0.5 transition-colors">✕ clear filter</button>
    </div>
    <button onclick="doSync()" id="sync-btn" class="flex items-center gap-1.5 text-[12px] text-[#475569] hover:text-[#94a3b8] transition-colors">
      <span id="sync-icon" class="text-[14px]">↻</span> Sync
    </button>
    <div id="db-pill" class="text-[11px] text-[#334155] font-mono"></div>
  </div>
</div>

<!-- Browse Tab -->
<div id="pane-browse" class="px-6 py-5 max-w-4xl mx-auto">

  <!-- Stats row -->
  <div class="grid grid-cols-3 gap-3 mb-6">
    <div class="card px-4 py-3 flex items-center gap-3">
      <div class="text-2xl font-bold text-white" id="s-prompts">—</div>
      <div class="text-[12px] text-[#475569]">prompts sent</div>
    </div>
    <div class="card px-4 py-3 flex items-center gap-3">
      <div class="text-2xl font-bold text-white" id="s-messages">—</div>
      <div class="text-[12px] text-[#475569]">messages total</div>
    </div>
    <div class="card px-4 py-3 flex items-center gap-3">
      <div class="text-2xl font-bold text-white" id="s-sessions">—</div>
      <div class="text-[12px] text-[#475569]">sessions</div>
    </div>
  </div>

  <!-- Session list -->
  <div id="session-list" class="space-y-1"></div>
  <div id="empty-state" class="hidden text-center text-[#334155] py-16 text-sm">No sessions match this filter.</div>
</div>

<!-- Search Tab -->
<div id="pane-search" class="px-6 py-5 max-w-4xl mx-auto hidden">
  <div class="card p-4 mb-5">
    <div class="flex gap-2">
      <input id="q" type="text" placeholder="Search across all conversations…"
        class="flex-1 bg-[#0d0d12] border border-[#23233a] rounded-lg px-4 py-2.5 text-white text-[14px]"
        onkeydown="if(event.key==='Enter')doSearch()">
      <select id="q-time" class="bg-[#0d0d12] border border-[#23233a] rounded-lg px-3 py-2.5 text-[#64748b] text-sm">
        <option value="">All time</option>
        <option value="24h">Last 24h</option>
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
      </select>
      <button onclick="doSearch()" class="px-5 py-2.5 rounded-lg text-sm font-medium text-white" style="background:#4f46e5">Search</button>
    </div>
    <div class="mt-2 text-[12px] text-[#334155]">Press <kbd class="bg-[#1e1e30] px-1.5 py-0.5 rounded text-[11px]">/</kbd> to focus • <kbd class="bg-[#1e1e30] px-1.5 py-0.5 rounded text-[11px]">Enter</kbd> to search</div>
  </div>
  <div id="search-status" class="text-[#475569] text-sm mb-4 min-h-[20px]"></div>
  <div id="search-results" class="space-y-3"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let allSessions = [];
let activeTag = null;
let expandedSession = null;

// ── Utils ──────────────────────────────────────────────────────────────────
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = n => Number(n||0).toLocaleString();

function relTime(ts) {
  if (!ts) return '?';
  const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
  const diff = Date.now() - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  if (diff < 172800000) return 'yesterday';
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function dayLabel(ts) {
  if (!ts) return 'Unknown';
  const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 86400000 && now.getDate() === d.getDate()) return 'Today';
  if (diff < 172800000) return 'Yesterday';
  const days = Math.floor(diff / 86400000);
  if (days < 7) return 'This Week';
  if (days < 30) return 'Last Month';
  return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}

function highlight(text, query) {
  if (!query || !text) return esc(text||'');
  let result = esc(text);
  query.trim().split(/\s+/).filter(Boolean).forEach(term => {
    const re = new RegExp('('+esc(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    result = result.replace(re,'<mark>$1</mark>');
  });
  return result;
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function setTab(name, pushHistory=true) {
  ['browse','search'].forEach(t => {
    document.getElementById('pane-'+t).classList.toggle('hidden', t!==name);
    document.getElementById('tab-'+t).classList.toggle('on', t===name);
  });
  if (name==='search') setTimeout(()=>document.getElementById('q').focus(),50);
  if (pushHistory) history.pushState({tab:name, tag:activeTag}, '', '#'+name);
}

function goHome() {
  clearFilter(false);
  if (expandedSession) {
    document.getElementById('detail-'+expandedSession)?.classList.add('hidden');
    document.getElementById('card-'+expandedSession)?.classList.remove('expanded');
    expandedSession = null;
  }
  setTab('browse');
  window.scrollTo({top:0, behavior:'smooth'});
}

function clearFilter(rerender=true) {
  activeTag = null;
  document.querySelectorAll('.tag').forEach(el => el.classList.remove('active'));
  document.getElementById('clear-filter-btn').classList.add('hidden');
  if (rerender) renderSessions();
}

// Browser back/forward
window.addEventListener('popstate', e => {
  const state = e.state || {tab:'browse', tag:null};
  if (state.tag !== activeTag) {
    activeTag = state.tag;
    document.querySelectorAll('.tag').forEach(el => el.classList.remove('active'));
    if (activeTag) document.getElementById('tag-'+activeTag)?.classList.add('active');
    document.getElementById('clear-filter-btn').classList.toggle('hidden', !activeTag);
    renderSessions();
  }
  setTab(state.tab || 'browse', false);
});

// ── Tag filter bar ─────────────────────────────────────────────────────────
async function loadTags() {
  const tags = await fetch('/api/tags').then(r=>r.json());
  const bar = document.getElementById('tag-bar');
  bar.innerHTML = tags.map(t=>`
    <button onclick="filterTag('${esc(t.tag)}')" id="tag-${esc(t.tag)}"
      class="tag">${esc(t.tag)} <span class="text-[#334155] ml-1">${t.count}</span></button>
  `).join('');
}

function filterTag(tag) {
  activeTag = activeTag === tag ? null : tag;
  document.querySelectorAll('.tag').forEach(el => el.classList.remove('active'));
  if (activeTag) document.getElementById('tag-'+activeTag)?.classList.add('active');
  document.getElementById('clear-filter-btn').classList.toggle('hidden', !activeTag);
  history.pushState({tab:'browse', tag:activeTag}, '', '#browse');
  renderSessions();
}

// ── Status + sessions load ─────────────────────────────────────────────────
async function loadStatus() {
  const d = await fetch('/api/status').then(r=>r.json());
  document.getElementById('s-prompts').textContent  = fmt(d.total_prompts);
  document.getElementById('s-messages').textContent = fmt(d.total_messages);
  document.getElementById('s-sessions').textContent = fmt(d.total_sessions);
  document.getElementById('db-pill').textContent    = d.db_size_kb + ' KB';
}

async function loadSessions() {
  allSessions = await fetch('/api/sessions?limit=500').then(r=>r.json());
  renderSessions();
  loadTags();
}

// ── Render session cards ───────────────────────────────────────────────────
function renderSessions() {
  const list = document.getElementById('session-list');
  const empty = document.getElementById('empty-state');

  let sessions = allSessions;
  if (activeTag) {
    sessions = sessions.filter(s => (s.project_tags||'').includes(activeTag));
  }

  if (!sessions.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  // Group by day label
  const groups = {};
  sessions.forEach(s => {
    const g = dayLabel(s.started_at);
    if (!groups[g]) groups[g] = [];
    groups[g].push(s);
  });

  const ORDER = ['Today','Yesterday','This Week','Last Month'];
  const sorted = Object.keys(groups).sort((a,b) => {
    const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return 0;
  });

  list.innerHTML = sorted.map(group => `
    <div class="mb-6">
      <div class="date-group text-[11px] font-semibold uppercase tracking-widest text-[#334155] py-2 mb-2" style="background:#0d0d12cc">
        ${esc(group)}
      </div>
      <div class="space-y-1.5">
        ${groups[group].map(s => renderCard(s)).join('')}
      </div>
    </div>
  `).join('');
}

function renderCard(s) {
  const sid = s.session_id;
  const title = s.title || 'Untitled session';
  const summary = s.summary || '';
  const tags = (s.project_tags||'').split(',').filter(Boolean);
  const statusDot = s.status === 'active' ? 'dot-active' : s.status === 'busy' ? 'dot-busy' : 'dot-idle';
  const msgs = s.msg_count || 0;
  const when = relTime(s.started_at);
  const methodBadge = s.method === 'ollama'
    ? '<span class="text-[10px] text-[#334155] ml-1">✦</span>' : '';

  const tagHtml = tags.map(t=>`<span class="tag text-[10px]">${esc(t)}</span>`).join('');

  return `
    <div class="session-card px-4 py-3.5 fade-in" id="card-${sid}" onclick="toggleCard('${sid}')">
      <div class="flex items-start gap-3">
        <div class="w-1.5 h-1.5 rounded-full mt-2 shrink-0 ${statusDot}"></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-0.5">
            <span class="text-white text-[14px] font-medium leading-snug">${esc(title)}${methodBadge}</span>
          </div>
          <div class="flex items-center gap-3 text-[12px] text-[#475569]">
            <span>${when}</span>
            <span>·</span>
            <span>${msgs} messages</span>
            <span>·</span>
            <span class="font-mono text-[11px]">${sid.slice(0,8)}</span>
          </div>
          ${tagHtml ? `<div class="flex gap-1.5 mt-1.5">${tagHtml}</div>` : ''}
        </div>
      </div>
      <div id="detail-${sid}" class="hidden mt-4 pt-4 border-t border-[#1e1e30]"></div>
    </div>`;
}

// ── Expand / collapse session detail ──────────────────────────────────────
async function toggleCard(sid) {
  const card = document.getElementById('card-'+sid);
  const detail = document.getElementById('detail-'+sid);

  if (!detail.classList.contains('hidden')) {
    detail.classList.add('hidden');
    card.classList.remove('expanded');
    return;
  }

  // Close previously expanded
  if (expandedSession && expandedSession !== sid) {
    document.getElementById('detail-'+expandedSession)?.classList.add('hidden');
    document.getElementById('card-'+expandedSession)?.classList.remove('expanded');
  }
  expandedSession = sid;
  card.classList.add('expanded');

  if (detail.innerHTML.trim()) {
    detail.classList.remove('hidden');
    return;
  }

  detail.innerHTML = '<div class="text-[#334155] text-sm animate-pulse">Loading…</div>';
  detail.classList.remove('hidden');

  const msgs = await fetch(`/api/session/${sid}`).then(r=>r.json());

  if (!msgs.length) {
    detail.innerHTML = '<div class="text-[#334155] text-sm">No messages found.</div>';
    return;
  }

  detail.innerHTML = '<div class="space-y-2 max-h-[520px] overflow-y-auto pr-1">' +
    msgs.map(m => {
      if (m.tool_name && !m.content_text) {
        return `<div class="msg-tool pl-3 py-1">
          <span class="text-[#f59e0b] text-[10px] font-bold font-mono mr-2">TOOL</span>
          <span class="text-[#64748b] text-[12px]">${esc(m.tool_name)}</span>
        </div>`;
      }
      const isUser = m.role === 'user';
      const cls = isUser ? 'msg-user' : 'msg-asst';
      const label = isUser ? 'YOU' : 'ASST';
      const color = isUser ? 'text-[#818cf8]' : 'text-[#4ade80]';
      const text = (m.content_text||'').trim().slice(0,600);
      const more = (m.content_text||'').length > 600 ? `<span class="text-[#334155]"> …${(m.content_text.length-600)} more chars</span>` : '';
      return `<div class="${cls} pl-3 py-1.5">
        <div class="flex items-baseline gap-2">
          <span class="${color} text-[10px] font-bold font-mono shrink-0">${label}</span>
          <span class="text-[#cbd5e1] text-[12px] leading-relaxed">${esc(text)}${more}</span>
        </div>
      </div>`;
    }).join('') +
  '</div>';
}

// ── Search ─────────────────────────────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('q').value.trim();
  const last = document.getElementById('q-time').value;
  if (!q) { document.getElementById('search-status').textContent = 'Enter a query.'; return; }

  document.getElementById('search-status').textContent = 'Searching…';
  document.getElementById('search-results').innerHTML = '';

  const params = new URLSearchParams({q, last, limit:60});
  const results = await fetch('/api/search?'+params).then(r=>r.json());

  if (!results.length) {
    document.getElementById('search-status').textContent = `No results for "${q}"`;
    return;
  }
  document.getElementById('search-status').textContent = `${results.length} result(s) for "${q}"`;

  // Group by session
  const bySession = {};
  results.forEach(r => { if(!bySession[r.session_id]) bySession[r.session_id]=[]; bySession[r.session_id].push(r); });

  document.getElementById('search-results').innerHTML = Object.entries(bySession).map(([sid,msgs]) => {
    const first = msgs[0];
    const session = allSessions.find(s=>s.session_id===sid);
    const title = session?.title || sid.slice(0,8)+'…';
    const tags = (session?.project_tags||'').split(',').filter(Boolean).map(t=>`<span class="tag text-[10px]">${esc(t)}</span>`).join('');

    const msgHtml = msgs.slice(0,6).map(m => {
      const isUser = m.role==='user';
      const cls = isUser ? 'msg-user' : 'msg-asst';
      const label = isUser ? 'YOU' : 'ASST';
      const color = isUser ? 'text-[#818cf8]' : 'text-[#4ade80]';
      return `<div class="${cls} pl-3 py-1.5">
        <span class="${color} text-[10px] font-bold font-mono mr-2">${label}</span>
        <span class="text-[#cbd5e1] text-[12px] leading-relaxed">${highlight(m.text.slice(0,360), q)}</span>
      </div>`;
    }).join('');

    return `<div class="card p-4 fade-in">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-white text-[13px] font-medium">${esc(title)}</span>
          ${tags}
        </div>
        <span class="text-[#334155] text-[12px] shrink-0 ml-3">${relTime(first.ts)}</span>
      </div>
      <div class="space-y-1.5">${msgHtml}</div>
      ${msgs.length>6?`<div class="text-[#334155] text-[11px] mt-2">+ ${msgs.length-6} more in this session</div>`:''}
    </div>`;
  }).join('');
}

// ── Sync ───────────────────────────────────────────────────────────────────
async function doSync() {
  const icon = document.getElementById('sync-icon');
  icon.classList.add('spinner');
  document.getElementById('sync-btn').style.pointerEvents = 'none';
  try {
    await fetch('/api/sync');
    await Promise.all([loadStatus(), loadSessions()]);
  } finally {
    icon.classList.remove('spinner');
    document.getElementById('sync-btn').style.pointerEvents = '';
    icon.textContent = '✓';
    setTimeout(()=>{ icon.textContent='↻'; }, 1500);
  }
}

// ── Keyboard ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='/' && e.target.tagName!=='INPUT') { e.preventDefault(); setTab('search'); }
  if (e.key==='Escape') { setTab('browse'); }
});

// ── Boot ───────────────────────────────────────────────────────────────────
// Seed initial history state so back button has somewhere to go
history.replaceState({tab:'browse', tag:null}, '', '#browse');
Promise.all([loadStatus(), loadSessions()]);
</script>
</body>
</html>
